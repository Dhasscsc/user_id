<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>தாஸ் - வாடிக்கையாளர் யூசர் ஐடி / பாஸ்வேர்டு மேலாளர்</title>
<style>
  :root{
    --bg:#0f172a;
    --card:#1e293b;
    --card2:#16213a;
    --accent:#22c55e;
    --accent2:#3b82f6;
    --danger:#ef4444;
    --warn:#f59e0b;
    --text:#e2e8f0;
    --muted:#94a3b8;
    --border:#334155;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Noto Sans Tamil","Segoe UI",sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:var(--text);
    min-height:100vh;
    padding:16px;
  }
  .wrap{max-width:960px;margin:0 auto;}
  header{
    text-align:center;
    padding:18px 10px 22px;
  }
  header h1{
    margin:0;
    font-size:22px;
    background:linear-gradient(90deg,#22c55e,#3b82f6);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  header p{color:var(--muted);font-size:13px;margin:6px 0 0;}

  .toolbar{
    display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;
  }
  .toolbar input[type=text]{
    flex:1;min-width:200px;
    padding:12px 14px;border-radius:10px;
    border:1px solid var(--border);
    background:var(--card);color:var(--text);font-size:15px;
  }
  button{
    cursor:pointer;border:none;border-radius:10px;
    padding:11px 16px;font-size:14px;font-weight:600;
    transition:transform .1s ease, opacity .15s ease;
    font-family:inherit;
  }
  button:active{transform:scale(0.96);}
  .btn-primary{background:var(--accent);color:#04210f;}
  .btn-blue{background:var(--accent2);color:#04122a;}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-wa{background:#25D366;color:#04210f;}
  .btn-mail{background:#f59e0b;color:#2a1a00;}
  .btn-sm{padding:8px 10px;font-size:13px;border-radius:8px;}

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    margin-bottom:16px;
  }
  .card h2{margin:0 0 12px;font-size:16px;color:var(--accent2);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(max-width:560px){.grid2{grid-template-columns:1fr;}}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;}
  input, textarea{
    width:100%;padding:10px 12px;border-radius:8px;
    border:1px solid var(--border);background:var(--card2);
    color:var(--text);font-size:14px;font-family:inherit;
  }
  textarea{resize:vertical;min-height:50px;}
  .field{margin-bottom:10px;}

  .pw-wrap{position:relative;}
  .pw-wrap button{
    position:absolute;right:4px;top:4px;
    background:var(--border);color:var(--text);
    padding:6px 10px;border-radius:6px;font-size:12px;
  }

  .save-row{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap;}

  .list-header{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:10px;flex-wrap:wrap;gap:8px;
  }
  .count-pill{
    background:var(--card2);border:1px solid var(--border);
    padding:4px 12px;border-radius:20px;font-size:12px;color:var(--muted);
  }

  .entry{
    background:var(--card2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    margin-bottom:10px;
  }
  .entry-top{
    display:flex;justify-content:space-between;align-items:flex-start;
    gap:10px;flex-wrap:wrap;
  }
  .entry-name{font-size:16px;font-weight:700;color:var(--text);}
  .entry-service{
    display:inline-block;font-size:12px;color:#04210f;
    background:var(--accent);padding:2px 10px;border-radius:12px;
    margin-top:4px;
  }
  .entry-phone{font-size:13px;color:var(--muted);margin-top:4px;}
  .entry-creds{
    margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;
  }
  @media(max-width:520px){.entry-creds{grid-template-columns:1fr;}}
  .cred-box{
    background:var(--card);border:1px solid var(--border);
    border-radius:8px;padding:8px 10px;
    display:flex;justify-content:space-between;align-items:center;
    gap:6px;
  }
  .cred-box .val{font-family:monospace;font-size:14px;color:var(--accent2);word-break:break-all;}
  .cred-label{font-size:11px;color:var(--muted);}
  .copy-btn{
    background:var(--border);color:var(--text);
    padding:4px 8px;font-size:11px;border-radius:6px;flex-shrink:0;
  }
  .entry-note{font-size:13px;color:var(--muted);margin-top:8px;white-space:pre-wrap;}
  .entry-date{font-size:11px;color:var(--muted);margin-top:6px;}
  .entry-actions{
    display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;
  }
  .empty{
    text-align:center;color:var(--muted);padding:40px 10px;font-size:14px;
  }
  .backup-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
  #fileInput{display:none;}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:#111827;border:1px solid var(--accent);color:var(--text);
    padding:10px 18px;border-radius:20px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .25s ease;
    z-index:999;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>தாஸ் பொது சேவை மையம்</h1>
    <p>வாடிக்கையாளர் யூசர் ஐடி &amp; பாஸ்வேர்டு பாதுகாப்பு டூல்</p>
  </header>

  <div class="card">
    <h2 id="formTitle">➕ புதிய பதிவு சேர்க்க</h2>
    <input type="hidden" id="editId">
    <div class="grid2">
      <div class="field">
        <label>வாடிக்கையாளர் பெயர் *</label>
        <input type="text" id="custName" placeholder="எ.கா. முருகன்">
      </div>
      <div class="field">
        <label>தொலைபேசி எண் (WhatsApp)</label>
        <input type="text" id="custPhone" placeholder="எ.கா. 9876543210">
      </div>
    </div>
    <div class="grid2">
      <div class="field">
        <label>சேவை / இணையதளம் *</label>
        <input type="text" id="serviceName" placeholder="எ.கா. Aadhaar Portal, PAN Site, Ration Card">
      </div>
      <div class="field">
        <label>மின்னஞ்சல் (Email - விருப்பம்)</label>
        <input type="text" id="custEmail" placeholder="எ.கா. name@gmail.com">
      </div>
    </div>
    <div class="grid2">
      <div class="field">
        <label>யூசர் ஐடி *</label>
        <input type="text" id="userId" placeholder="User ID">
      </div>
      <div class="field">
        <label>பாஸ்வேர்டு *</label>
        <div class="pw-wrap">
          <input type="text" id="password" placeholder="Password">
        </div>
      </div>
    </div>
    <div class="field">
      <label>குறிப்பு (Notes - விருப்பம்)</label>
      <textarea id="note" placeholder="எ.கா. Security question, registered mobile, மற்ற தகவல்கள்..."></textarea>
    </div>
    <div class="save-row">
      <button class="btn-outline" onclick="resetForm()">🔄 அழி</button>
      <button class="btn-primary" onclick="saveEntry()">💾 சேமி</button>
    </div>
  </div>

  <div class="card">
    <div class="list-header">
      <h2 style="margin:0;">📋 பதிவுகள்</h2>
      <span class="count-pill" id="countPill">0 பதிவுகள்</span>
    </div>
    <div class="toolbar">
      <input type="text" id="searchBox" placeholder="🔍 பெயர் / தொலைபேசி / சேவை மூலம் தேடு..." oninput="renderList()">
    </div>
    <div id="listArea"></div>

    <div class="backup-row">
      <button class="btn-blue btn-sm" onclick="exportJSON()">⬇️ JSON Backup எடு</button>
      <button class="btn-outline btn-sm" onclick="document.getElementById('fileInput').click()">⬆️ JSON Backup ஏற்று</button>
      <input type="file" id="fileInput" accept=".json" onchange="importJSON(event)">
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'dhass_customer_credentials_v1';
let entries = [];

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    entries = raw ? JSON.parse(raw) : [];
  }catch(e){ entries = []; }
}
function persist(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function resetForm(){
  document.getElementById('editId').value='';
  document.getElementById('custName').value='';
  document.getElementById('custPhone').value='';
  document.getElementById('custEmail').value='';
  document.getElementById('serviceName').value='';
  document.getElementById('userId').value='';
  document.getElementById('password').value='';
  document.getElementById('note').value='';
  document.getElementById('formTitle').textContent='➕ புதிய பதிவு சேர்க்க';
}

function saveEntry(){
  const name = document.getElementById('custName').value.trim();
  const service = document.getElementById('serviceName').value.trim();
  const uid = document.getElementById('userId').value.trim();
  const pw = document.getElementById('password').value.trim();

  if(!name || !service || !uid || !pw){
    alert('பெயர், சேவை, யூசர் ஐடி, பாஸ்வேர்டு ஆகியவை கட்டாயம் நிரப்ப வேண்டும்');
    return;
  }

  const editId = document.getElementById('editId').value;
  const data = {
    id: editId || 'C'+Date.now(),
    name,
    phone: document.getElementById('custPhone').value.trim(),
    email: document.getElementById('custEmail').value.trim(),
    service,
    userId: uid,
    password: pw,
    note: document.getElementById('note').value.trim(),
    date: editId ? (entries.find(e=>e.id===editId)?.date || new Date().toISOString()) : new Date().toISOString(),
    updated: new Date().toISOString()
  };

  if(editId){
    const idx = entries.findIndex(e=>e.id===editId);
    if(idx>-1) entries[idx]=data;
  } else {
    entries.unshift(data);
  }
  persist();
  resetForm();
  renderList();
  showToast('✅ சேமிக்கப்பட்டது');
}

function editEntry(id){
  const e = entries.find(x=>x.id===id);
  if(!e) return;
  document.getElementById('editId').value=e.id;
  document.getElementById('custName').value=e.name;
  document.getElementById('custPhone').value=e.phone||'';
  document.getElementById('custEmail').value=e.email||'';
  document.getElementById('serviceName').value=e.service;
  document.getElementById('userId').value=e.userId;
  document.getElementById('password').value=e.password;
  document.getElementById('note').value=e.note||'';
  document.getElementById('formTitle').textContent='✏️ பதிவை திருத்து';
  window.scrollTo({top:0,behavior:'smooth'});
}

function deleteEntry(id){
  if(!confirm('இந்த பதிவை நீக்க வேண்டுமா?')) return;
  entries = entries.filter(e=>e.id!==id);
  persist();
  renderList();
  showToast('🗑️ நீக்கப்பட்டது');
}

function copyVal(val){
  navigator.clipboard.writeText(val).then(()=>showToast('📋 காப்பி செய்யப்பட்டது'));
}

function buildMessage(e){
  return `*தாஸ் பொது சேவை மையம்*\n\nவணக்கம் ${e.name},\n\nஉங்கள் *${e.service}* கணக்கு விவரங்கள்:\n\nயூசர் ஐடி: ${e.userId}\nபாஸ்வேர்டு: ${e.password}\n\n${e.note ? 'குறிப்பு: '+e.note+'\n\n' : ''}இந்த விவரங்களை பாதுகாப்பாக வைத்திருங்கள்.\n\n- தாஸ் பொது சேவை மையம், தூத்துக்குடி`;
}

function shareWhatsApp(id){
  const e = entries.find(x=>x.id===id);
  if(!e) return;
  if(!e.phone){
    alert('இந்த வாடிக்கையாளருக்கு தொலைபேசி எண் இல்லை. பதிவை திருத்தி எண் சேர்க்கவும்.');
    return;
  }
  let phone = e.phone.replace(/\D/g,'');
  if(phone.length===10) phone = '91'+phone;
  const msg = encodeURIComponent(buildMessage(e));
  window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
}

function shareEmail(id){
  const e = entries.find(x=>x.id===id);
  if(!e) return;
  if(!e.email){
    alert('இந்த வாடிக்கையாளருக்கு மின்னஞ்சல் இல்லை. பதிவை திருத்தி மின்னஞ்சல் சேர்க்கவும்.');
    return;
  }
  const subject = encodeURIComponent(`${e.service} - கணக்கு விவரங்கள் - தாஸ் பொது சேவை மையம்`);
  const body = encodeURIComponent(buildMessage(e));
  window.location.href = `mailto:${e.email}?subject=${subject}&body=${body}`;
}

function renderList(){
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const listArea = document.getElementById('listArea');
  const filtered = entries.filter(e=>{
    if(!q) return true;
    return (e.name||'').toLowerCase().includes(q) ||
           (e.phone||'').toLowerCase().includes(q) ||
           (e.service||'').toLowerCase().includes(q) ||
           (e.userId||'').toLowerCase().includes(q);
  });

  document.getElementById('countPill').textContent = `${filtered.length} / ${entries.length} பதிவுகள்`;

  if(filtered.length===0){
    listArea.innerHTML = `<div class="empty">📭 பதிவுகள் இல்லை</div>`;
    return;
  }

  listArea.innerHTML = filtered.map(e=>{
    const dt = new Date(e.date);
    const dateStr = dt.toLocaleDateString('ta-IN', {day:'2-digit',month:'short',year:'numeric'});
    return `
    <div class="entry">
      <div class="entry-top">
        <div>
          <div class="entry-name">${escapeHtml(e.name)}</div>
          <span class="entry-service">${escapeHtml(e.service)}</span>
          ${e.phone ? `<div class="entry-phone">📱 ${escapeHtml(e.phone)}</div>` : ''}
        </div>
      </div>
      <div class="entry-creds">
        <div class="cred-box">
          <div>
            <div class="cred-label">யூசர் ஐடி</div>
            <div class="val">${escapeHtml(e.userId)}</div>
          </div>
          <button class="copy-btn" onclick="copyVal('${escapeAttr(e.userId)}')">காப்பி</button>
        </div>
        <div class="cred-box">
          <div>
            <div class="cred-label">பாஸ்வேர்டு</div>
            <div class="val">${escapeHtml(e.password)}</div>
          </div>
          <button class="copy-btn" onclick="copyVal('${escapeAttr(e.password)}')">காப்பி</button>
        </div>
      </div>
      ${e.note ? `<div class="entry-note">📝 ${escapeHtml(e.note)}</div>` : ''}
      <div class="entry-date">உருவாக்கப்பட்ட தேதி: ${dateStr}</div>
      <div class="entry-actions">
        <button class="btn-wa btn-sm" onclick="shareWhatsApp('${e.id}')">📤 WhatsApp</button>
        <button class="btn-mail btn-sm" onclick="shareEmail('${e.id}')">📧 Email</button>
        <button class="btn-outline btn-sm" onclick="editEntry('${e.id}')">✏️ திருத்து</button>
        <button class="btn-danger btn-sm" onclick="deleteEntry('${e.id}')">🗑️ நீக்கு</button>
      </div>
    </div>`;
  }).join('');
}

function escapeHtml(str){
  if(!str) return '';
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){
  if(!str) return '';
  return str.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}

function exportJSON(){
  const blob = new Blob([JSON.stringify(entries, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `dhass_credentials_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('⬇️ Backup பதிவிறக்கம் ஆனது');
}

function importJSON(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const imported = JSON.parse(e.target.result);
      if(!Array.isArray(imported)) throw new Error('Invalid format');
      const existingIds = new Set(entries.map(x=>x.id));
      let added = 0;
      imported.forEach(item=>{
        if(!existingIds.has(item.id)){
          entries.push(item);
          added++;
        }
      });
      entries.sort((a,b)=> new Date(b.date) - new Date(a.date));
      persist();
      renderList();
      showToast(`✅ ${added} புதிய பதிவுகள் இணைக்கப்பட்டன`);
    }catch(err){
      alert('கோப்பை படிக்க முடியவில்லை. சரியான Backup JSON கோப்பை தேர்ந்தெடுக்கவும்.');
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

// Init
load();
renderList();
</script>
</body>
</html>
